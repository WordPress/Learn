name: Static Analysis (Linting)

# This workflow is triggered on pushes to trunk, and any PRs.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# A new push to the same PR supersedes any lint run still in flight.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to clone the repo
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-composer

    - name: Lint PHP
      run: yarn lint:php

  js:
    name: Lint JavaScript and Styles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to clone the repo
    steps:
    - uses: actions/checkout@v4

    # Needed for the .eslintrc.js / .stylelintrc that wporg-repo-tools provides.
    - uses: ./.github/actions/setup-composer

    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    - name: Restore node_modules cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          wp-content/mu-plugins/pub/locale-switcher/node_modules
          wp-content/plugins/wporg-learn/node_modules
          wp-content/themes/pub/wporg-learn-2024/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'yarn.lock') }}

    - name: yarn install
      run: yarn install --frozen-lockfile --prefer-offline

    - name: Lint JavaScript
      run: yarn lint:js

    - name: Lint Styles
      run: yarn lint:css
