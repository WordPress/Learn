name: I18n

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  translation-strings:
    name: Translation strings

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Required to commit and push updated translation strings

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install svn
        shell: bash
        run: |
          sudo apt install subversion

      - name: Set PHP version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        run: composer install

      - name: Git reset and clean
        run: |
          git reset --hard
          git clean -f -d

      - name: Run translation script
        run: php ./bin/i18n.php

      - name: Commit and push
        # Using a specific hash here instead of a tagged version, for risk mitigation, since this action modifies our repo.
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # v1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: trunk
          message: Update translation strings
