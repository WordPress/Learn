name: Set up Composer dependencies
description: Restores vendor/ from cache, installing it (and the svn client Composer needs) only on a cache miss.

runs:
  using: composite
  steps:
    - name: Restore vendor cache
      id: vendor-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

    # Two require-dev packages are checked out from meta.svn.wordpress.org.
    - name: Install svn
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends subversion

    - name: composer install
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      shell: bash
      run: composer install --no-interaction --no-progress

    # The svn checkout into wp-content/mu-plugins/pub can clobber tracked files.
    - name: Git reset and clean
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git reset --hard
        git clean -f -d
